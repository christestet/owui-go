version: 2
project_name: owui

before:
  hooks:
    - go mod tidy

builds:
  - id: "owui"
    main: ./cmd/owui
    binary: owui
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/christestet/owui-go/internal/cli/version.Version={{.Version}}
      - -X github.com/christestet/owui-go/internal/cli/version.Commit={{.ShortCommit}}
      - -X github.com/christestet/owui-go/internal/cli/version.Date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^openapi-reference:'
