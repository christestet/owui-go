version: 2
project_name: owui

before:
  hooks:
    - go mod tidy

builds:
  - id: "owui"
    main: ./cmd/owui
    binary: owui
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/christestet/owui-go/internal/cli/version.Version={{.Version}}
      - -X github.com/christestet/owui-go/internal/cli/version.Commit={{.ShortCommit}}
      - -X github.com/christestet/owui-go/internal/cli/version.Date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats:
      - tar.gz

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?\!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))?\!?:.+$'
      order: 1
    - title: CI/CD
      regexp: '^.*?ci(\(.+\))?\!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^openapi-reference:'
      - '^Merge pull request'
      - '^Merge branch'
      - '^chore\(deps\):'
