version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - dupl
    - errorlint
    - gocritic
    - gosec
    - misspell
    - sloglint
    - unconvert
  exclusions:
    rules:
      # Fixture reads, httptest plumbing, and table-driven duplication are
      # fine in tests; bodyclose cannot see closes inside test helpers.
      - path: _test\.go
        linters:
          - bodyclose
          - dupl
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
